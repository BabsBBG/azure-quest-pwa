name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: node scripts/validate-harness.mjs
      - run: node scripts/validate-question-bank.mjs
      - run: npm run validate:source-grounding
      - run: npm run validate:source-ingestion
      - run: npm run validate:knowledge-graph
      - run: npm run validate:learning-summaries
      - run: npm run validate:question-generation
      - run: npm run validate:content-orchestration
      - run: npm run validate:question-critic
      - run: npm run validate:source-impact
      - run: npm run validate:admin-review-studio
      - run: npm run validate:curated-domain-quizzes
      - run: npm run validate:finite-runs
      - run: npm run validate:duplicates
      - run: npm run validate:authorization
      - run: npm run validate:rich-items
      - run: node scripts/check-routes.mjs
      - run: npm run build
