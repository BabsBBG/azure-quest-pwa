name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: node scripts/validate-harness.mjs
      - run: node scripts/validate-question-bank.mjs
      - run: npm run validate:source-grounding
      - run: npm run validate:source-ingestion
      - run: npm run validate:knowledge-graph
      - run: npm run validate:learning-summaries
      - run: npm run validate:question-generation
      - run: npm run validate:content-orchestration
      - run: npm run validate:question-critic
      - run: npm run validate:source-impact
      - run: npm run validate:admin-review-studio
      - run: npm run validate:curated-domain-quizzes
      - run: npm run validate:finite-runs
      - run: npm run validate:content-quality-reports
      - run: npm run validate:duplicates
      - run: npm run validate:authorization
      - run: npm run validate:rich-items
      - run: npm run validate:github-import-controls
      - run: npm run validate:active-interview-recovery
      - run: npm run validate:auth-first-ia
      - run: npm run validate:assessment-shell
      - run: npm run validate:project-fixtures
      - run: npm run validate:routes
      - run: npm run test:e2e:chromium
      - run: npm run test:e2e:webkit
      - run: npm run test:e2e:mobile
      - run: npm run test:accessibility
      - run: npm run test:visual
      - run: npm run build
      - run: npm run test:production-smoke
        if: github.ref == 'refs/heads/main' && vars.PRODUCTION_BASE_URL != ''
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
